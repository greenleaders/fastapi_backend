<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soil Data Form</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 40, 85, 0.9), rgba(0, 40, 85, 0.9)), url('https://source.unsplash.com/1600x900/?agriculture,technology');
            background-size: cover;
            background-position: center;
            color: white;

        }
        body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.container {
    flex-grow: 1;
    max-width: 700px;
    margin: 40px auto;
}

.footer {
    background-color: #001f3f;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 1rem;
    margin-top: auto;
    border-top: 3px solid white;
}

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: rgba(0, 40, 85, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            color: white;
        }
        .form-label {
            font-weight: bold;
        }
        .soil-point {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .remove-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .remove-btn:hover {
            background-color: #c82333;
        }
        .btn-custom {
            background-color: #004080;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.3s;
            width: 100%;
        }
        .btn-custom:hover {
            background-color: #005bb5;
        }
        .footer {
            background-color: #001f3f;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 2rem;
            margin-top: 20px;
            border-top: 3px solid white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Artificial Intelligence Soil Analysis</h2>
    
    <form method="post" target="_blank">  
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">City:</label>
            <input type="text" class="form-control" name="city" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Country:</label>
            <input type="text" class="form-control" name="country" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Crop Type:</label>
            <input type="text" class="form-control" name="crop_type" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Growth Stage:</label>
            <input type="text" class="form-control" name="growth_stage" required>
        </div>

        <h4 class="mt-4">🧪 Soil Points</h4>
        <div id="soil-points-container"></div>

        <button type="button" class="btn btn-primary mt-3" onclick="addSoilPoint()">
            <i class="bi bi-plus-circle"></i> Add a Soil Sample Point
        </button>
        <br><br>
        
        <button type="submit" class="btn btn-success btn-lg w-100">
            <i class="bi bi-file-earmark-pdf"></i> Generate PDF Report
        </button>
        
        <br><br>
        <button type="button" class="btn btn-secondary w-100" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> Go Back
        </button>
    </form>
</div>

<footer class="footer">
    <p>&copy; 2025 Precision AI | Transforming Agriculture Sustainably</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function addSoilPoint() {
        let container = document.getElementById("soil-points-container");
        let newPoint = document.createElement("div");
        newPoint.classList.add("soil-point", "p-3", "shadow-sm");

        newPoint.innerHTML = `
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label">Soil pH (1-14):</label>
                    <input type="number" step="0.1" class="form-control" name="soil_ph" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nitrogen (mg/kg):</label>
                    <input type="number" class="form-control" name="nitrogen" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phosphorus (mg/kg):</label>
                    <input type="number" class="form-control" name="phosphorus" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Potassium (mg/kg):</label>
                    <input type="number" class="form-control" name="potassium" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Soil Moisture (%):</label>
                    <input type="number" class="form-control" name="soil_moisture" required>
                </div>
                <div class="col-md-6 text-end mt-3">
                    <button type="button" class="remove-btn btn-sm" onclick="removeSoilPoint(this)">
                        <i class="bi bi-trash"></i> Remove
                    </button>
                </div>
            </div>
        `;
        container.appendChild(newPoint);
    }

    function removeSoilPoint(button) {
        button.closest(".soil-point").remove();
    }
</script>

</body>
</html>
