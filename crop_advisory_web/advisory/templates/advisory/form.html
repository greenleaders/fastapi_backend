<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Data Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Crop Data Analysis</h2>
        <form id="cropDataForm" method="POST" action="{% url 'generate_advisory_pdf' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="crop_type" class="form-label">Crop Type</label>
                <input type="text" class="form-control" id="crop_type" name="crop_type" required>
            </div>
            <div class="mb-3">
                <label for="growth_stage" class="form-label">Growth Stage</label>
                <input type="text" class="form-control" id="growth_stage" name="growth_stage" required>
            </div>
            <div id="fieldPointsContainer">
                <div class="field-point mb-3">
                    <h4>Point 1</h4>
                    <input type="number" class="form-control mb-2" name="point-1-soil_ph" placeholder="Soil pH" required>
                    <input type="number" class="form-control mb-2" name="point-1-nitrogen" placeholder="Nitrogen" required>
                    <input type="number" class="form-control mb-2" name="point-1-phosphorus" placeholder="Phosphorus" required>
                    <input type="number" class="form-control mb-2" name="point-1-potassium" placeholder="Potassium" required>
                    <input type="number" class="form-control mb-2" name="point-1-soil_moisture" placeholder="Soil Moisture" required>
                </div>
            </div>
            <button type="button" class="btn btn-primary" id="addPointBtn">Add More Points</button>
            <button type="submit" class="btn btn-success mt-3">Submit</button>
        </form>

        <div id="result" class="mt-5">
            <h3>Analyzed Report</h3>
            <div id="pdfReport" style="display:none;">
                <iframe id="pdfIframe" width="100%" height="600px"></iframe>
                <button id="downloadBtn" class="btn btn-success mt-3">Download PDF</button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            let pointIndex = 1;

            $('#addPointBtn').click(function() {
                pointIndex++;
                const newPoint = `
                    <div class="field-point mb-3">
                        <h4>Point ${pointIndex}</h4>
                        <input type="number" class="form-control mb-2" name="point-${pointIndex}-soil_ph" placeholder="Soil pH" required>
                        <input type="number" class="form-control mb-2" name="point-${pointIndex}-nitrogen" placeholder="Nitrogen" required>
                        <input type="number" class="form-control mb-2" name="point-${pointIndex}-phosphorus" placeholder="Phosphorus" required>
                        <input type="number" class="form-control mb-2" name="point-${pointIndex}-potassium" placeholder="Potassium" required>
                        <input type="number" class="form-control mb-2" name="point-${pointIndex}-soil_moisture" placeholder="Soil Moisture" required>
                    </div>
                `;
                $('#fieldPointsContainer').append(newPoint);
            });

            $('#cropDataForm').submit(function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                $.ajax({
                    url: '/crop-advisory/',
                    method: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        const pdfBase64 = response.pdf_base64;
                        $('#pdfIframe').attr('src', 'data:application/pdf;base64,' + pdfBase64);
                        $('#pdfReport').show();

                        $('#downloadBtn').click(function() {
                            const link = document.createElement('a');
                            link.href = 'data:application/pdf;base64,' + pdfBase64;
                            link.download = 'field_analysis_report.pdf';
                            link.click();
                        });
                    },
                    error: function() {
                        alert('An error occurred while generating the report. Please try again.');
                    }
                });
            });
        });
    </script>
</body>
</html>
